name: discover-sources
on:
  workflow_dispatch:
  push:
    paths: [scripts/discover.py, .github/workflows/discover.yml]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4
      - run: python scripts/discover.py discover_out
      - uses: actions/upload-artifact@v4
        with:
          name: discover_out
          path: discover_out
          retention-days: 7
