name: discover-sources
on:
  workflow_dispatch:
  push:
    paths: [scripts/discover.py, .github/workflows/discover.yml]
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4
      - run: python scripts/discover.py discover_out 2>&1 | tee discover_log.txt
      - name: Push results to discover branch
        run: |
          mv discover_log.txt discover_out/
          find discover_out -size +90M -print -delete
          cd discover_out
          git init -q -b discover
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "discover results"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" discover
